# Skills shown in the "My favorite tools and technologies" table of README.md.
#
# Each group starts a new table row. Every skill names the icon source it is
# drawn from:
#   skill-icons   a ready-made tile from tandpfun/skill-icons (`ref` = file stem)
#   simple-icons  a Simple Icons glyph placed on a dark tile (`ref` = slug,
#                 `color` = brand hex; lightened to 4.5:1 contrast if too dark)
#   aws-icons     an AWS Architecture icon clipped to a rounded tile
#                 (`ref` = path under icons/ in the aws-icons package)
#   monogram      short text on a dark tile, for tools without a logo
#
# Regenerate with `uv run python -m readme_gen` after editing.

[sources]
skill-icons = "7f7e691e71aec64e8354bf697835e009d1ad80f8"
simple-icons = "13.21.0"
aws-icons = "3.3.0"

[layout]
columns = 8

[[groups]]
name = "Languages"
skills = [
  { name = "C", kind = "skill-icons", ref = "C" },
  { name = "C++", kind = "skill-icons", ref = "CPP" },
  { name = "Conan", kind = "simple-icons", ref = "conan", color = "#6699CB" },
  { name = "Python", kind = "skill-icons", ref = "Python-Dark" },
  { name = "Linux", kind = "skill-icons", ref = "Linux-Dark" },
  { name = "SQL", kind = "monogram", text = "SQL", color = "#4479A1" },
  { name = "YAML", kind = "simple-icons", ref = "yaml", color = "#CB171E" },
]

